device:
  # Override these to use a non-SteelSeries keyboard with an OLED display.
  # Leave commented out to use auto-detection (SteelSeries defaults).
  # vid: 0x1038       # USB vendor ID (hex)
  # pid: 0x1612       # USB product ID (hex)
  # interface: 1      # HID interface number
  # report_id: 0x61   # HID feature report ID
  # width: 128        # OLED width in pixels
  # height: 40        # OLED height in pixels

appearance:
  # Font must be in the same directory as the script (TrueType only)
  font: SpaceMono-Regular.ttf
  # Path to an image or GIF to show as a rotating page (leave blank to disable)
  image: W.gif
  # Size shouldn't be over 19; 12 = three-line display, 10 = four-line (hard to read)
  size: 12
  # Delay between rotating screens, in seconds
  delay: 5

sensors:
  # Linux-only sensor support
  cpu_percent: true
  load1: true
  load5: true
  load15: false
  core_temp: true
  gpu_temp: true
  cpu_freq: true
  cpu_max: false
  cpu_count: false
  mem_used: true
  mem_free: false
  mem_total: false
  mem_used_percent: false
  swap: true
  swap_percent: false
  battery: true
  disk_usage: true
  fan_speeds: true
  external_ip: false
